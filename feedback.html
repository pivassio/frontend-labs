<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Зворотній зв'язок - Style & Tech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header style="padding: 20px; background: #eee;">
        <h1>Зворотній зв'язок</h1>
        <nav>
            <a href="index.html">На головну</a>
        </nav>
    </header>

    <main class="feedback-container">
        <form action="#" method="post">
            <fieldset>
                <legend>Персональна інформація</legend>
                
                <p>
                    <label for="fullname">Прізвище та ім'я:</label><br>
                    <input type="text" id="fullname" name="fullname" required>
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="age">Вік:</label><br>
                    <input type="number" id="age" name="age" min="1" max="120">
                </p>
            </fieldset>

            <p>
                <label for="purpose">Мета звернення:</label><br>
                <select id="purpose" name="purpose">
                    <option value="cooperation">Співпраця</option>
                    <option value="complaint">Скарга</option>
                    <option value="proposal">Пропозиція</option>
                </select>
            </p>

            <p>
                <label for="details">Детально:</label><br>
                <textarea id="details" name="details" rows="5" cols="40"></textarea>
            </p>

            <p>
                <input type="checkbox" id="consent" name="consent">
                <label for="consent">Даю згоду на обробку інформації</label>
            </p>

            <p>
                <input type="submit" value="Відправити">
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Інтернет-магазин "Style & Tech"</p>
    </footer>

</body>
</html>
